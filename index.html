<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільний Дракончик Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Меню вибору класу -->
    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>Обери свій клас:</h2>
            <div id="class-select-container">
                <button class="opt-btn" onclick="startGame(5)">5 Клас</button>
                <button class="opt-btn" onclick="startGame(6)">6 Клас</button>
                <button class="opt-btn" onclick="startGame(7)">7 Клас</button>
                <button class="opt-btn" onclick="startGame(8)">8 Клас</button>
                <button class="opt-btn" onclick="startGame(9)">9 Клас</button>
                <button class="opt-btn" onclick="startGame(10)">10 Клас</button>
                <button class="opt-btn" onclick="startGame(11)">11 Клас</button>
            </div>
        </div>
    </div>

    <div id="game-container" class="day">
        <div id="celestial">☀️</div>
        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>

        <div class="hud">
            <div class="stat-box">Клас: <span id="class-display">-</span></div>
            <div class="stat-box">Рахунок: <span id="score">0</span>m</div>
            <div class="stat-box">Життя: <span id="lives">❤️❤️</span></div>
            <div class="stat-box">Бокси: <span id="boxes-count">📦 0/4</span> (Бали: <span id="points">0</span>)</div>
        </div>

        <div id="game">
            <div id="dino" class="running">🐉</div>
            <div id="cactus">🌵</div>
            <div id="mystery-box" class="hidden-box">📦</div>
            <div id="ground"></div>
        </div>
    </div>

    <!-- Модальне вікно запитань -->
    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content">
            <div id="badge-type" class="badge">ЗАПИТАННЯ</div>
            <h2 id="question-title">Запитання</h2>
            
            <div id="rebus-container" class="hidden">
                <div id="rebus-text" class="rebus-display"></div>
            </div>

            <p id="question-text">Текст запитання...</p>
            <div id="timer-display" class="timer hidden">Час: <span id="timer-sec">180</span>с</div>
            
            <div id="options-container"></div>
        </div>
    </div>

    <!-- Сертифікат перемоги -->
    <div id="victory-modal" class="modal hidden">
        <div class="modal-content victory-card">
            🎉 <h1>СЕРТИФІКАТ</h1> 🎉
            <h3>ЗВІЛЬНЕННЯ ВІД КОНТРОЛЬНОЇ РОБОТИ</h3>
            <p>Вітаємо! Учень успішно пройшов гру для <span id="cert-class"></span> класу!</p>
            <div class="certificate-code">ПРОМОКОД: <span id="cert-code">DINO-2026-FREE</span></div>
            <button onclick="location.reload()">Зіграти знову</button>
        </div>
    </div>

    <script src="questions.js"></script>

    <script>
        const dino = document.getElementById("dino");
        const cactus = document.getElementById("cactus");
        const box = document.getElementById("mystery-box");
        const gameContainer = document.getElementById("game-container");
        const celestial = document.getElementById("celestial");
        
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const boxesEl = document.getElementById("boxes-count");
        const pointsEl = document.getElementById("points");
        const classDisplay = document.getElementById("class-display");
        
        const startModal = document.getElementById("start-modal");
        const modal = document.getElementById("quiz-modal");
        const badgeType = document.getElementById("badge-type");
        const questionTitle = document.getElementById("question-title");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const rebusContainer = document.getElementById("rebus-container");
        const rebusText = document.getElementById("rebus-text");
        const timerDisplay = document.getElementById("timer-display");
        const timerSec = document.getElementById("timer-sec");

        let selectedClass = 9;
        let poolNormal = [];
        let poolHard = [];
        let poolRebuses = [];

        let score = 0;
        let lives = 2;
        let boxesCollected = 0;
        let totalPoints = 0;
        let currentSpeed = 2.0;
        
        let isJumping = false;
        let isGameOver = false;
        let isPaused = true; // Гра чекає на вибір класу
        let isNight = false;

        let reached100 = false;
        let reached1000 = false;
        let boxActive = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Запуск гри після вибору класу
        function startGame(grade) {
            selectedClass = grade;
            classDisplay.innerText = `${grade} кл`;
            document.getElementById("cert-class").innerText = `${grade}`;
            startModal.classList.add("hidden");

            // Формуємо пул запитань під вибраний клас
            poolNormal = shuffle([...questionsDB.byClass[grade]]);
            poolHard = shuffle([...questionsDB.hard]);
            poolRebuses = shuffle([...questionsDB.rebuses]);

            isPaused = false;
            resumeGame();
        }

        // Стрибок
        document.addEventListener("keydown", function(e) {
            if ((e.code === "Space" || e.code === "ArrowUp") && !isJumping && !isPaused && !isGameOver) {
                isJumping = true;
                dino.classList.remove("running");
                dino.classList.add("jump");
                setTimeout(() => {
                    dino.classList.remove("jump");
                    dino.classList.add("running");
                    isJumping = false;
                }, 600);
            }
        });

        // Ігровий таймер
        setInterval(() => {
            if (!isPaused && !isGameOver) {
                score++;
                scoreEl.innerText = score;

                if (score % 50 === 0 && currentSpeed > 0.9) {
                    currentSpeed -= 0.1;
                    cactus.style.animationDuration = currentSpeed + 's';
                }

                if (score % 200 === 0 && score > 0) {
                    toggleDayNight();
                }

                if (score >= 100 && !reached100) {
                    reached100 = true;
                    triggerRebus();
                }

                if (score >= 1000 && !reached1000) {
                    reached1000 = true;
                    triggerRebus();
                }

                if (score > 50 && score % 150 === 0 && !boxActive) {
                    spawnBox();
                }
            }
        }, 100);

        function toggleDayNight() {
            isNight = !isNight;
            gameContainer.className = isNight ? "night" : "day";
            celestial.innerText = isNight ? "🌙" : "☀️";
        }

        // Зіткнення
        setInterval(() => {
            if (isPaused || isGameOver) return;

            let dinoBottom = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
            let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));
            let boxLeft = parseInt(window.getComputedStyle(box).getPropertyValue("left"));

            if (cactusLeft > 50 && cactusLeft < 85 && dinoBottom <= 35) {
                pauseGame();
                triggerQuestion();
            }

            if (boxActive && boxLeft > 50 && boxLeft < 85 && dinoBottom > 30) {
                box.classList.add("hidden-box");
                boxActive = false;
                pauseGame();
                triggerBoxQuest();
            }
        }, 20);

        function spawnBox() {
            boxActive = true;
            box.classList.remove("hidden-box");
            box.style.animation = `moveCactus ${currentSpeed + 0.5}s linear`;
            setTimeout(() => {
                box.classList.add("hidden-box");
                boxActive = false;
            }, (currentSpeed + 0.5) * 1000);
        }

        function pauseGame() {
            isPaused = true;
            cactus.style.animationPlayState = 'paused';
            box.style.animationPlayState = 'paused';
        }

        function resumeGame() {
            isPaused = false;
            cactus.style.animation = 'none';
            cactus.offsetHeight;
            cactus.style.animation = `moveCactus ${currentSpeed}s infinite linear`;
            cactus.style.animationPlayState = 'running';
            if (boxActive) box.style.animationPlayState = 'running';
        }

        function updateLivesDisplay() {
            livesEl.innerText = lives > 0 ? "❤️".repeat(lives) : "❌";
        }

        function triggerQuestion() {
            if (poolNormal.length === 0) {
                poolNormal = shuffle([...questionsDB.byClass[selectedClass]]);
            }

            const qData = poolNormal.pop();

            badgeType.innerText = `⚠️ ЗІТКНЕННЯ (${selectedClass} КЛАС)`;
            badgeType.style.background = "#ff9800";
            questionTitle.innerText = "Дай відповідь:";
            rebusContainer.classList.add("hidden");
            timerDisplay.classList.add("hidden");

            questionText.innerText = qData.q;
            optionsContainer.innerHTML = "";

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    modal.classList.add("hidden");
                    if (idx === qData.correct) {
                        alert("Правильно!");
                    } else {
                        lives--;
                        updateLivesDisplay();
                        alert("Неправильно! Втрачено 1 сердечко 💔");
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                    resumeGame();
                };
                optionsContainer.appendChild(btn);
            });

            modal.classList.remove("hidden");
        }

        function triggerRebus() {
            if (poolRebuses.length === 0) poolRebuses = shuffle([...questionsDB.rebuses]);
            const rData = poolRebuses.pop();

            badgeType.innerText = "🧩 РЕБУС";
            badgeType.style.background = "#2196f3";
            questionTitle.innerText = "Розгадай ребус (+1 Сердечко):";
            
            rebusContainer.classList.remove("hidden");
            rebusText.innerText = rData.text;
            questionText.innerText = rData.q;
            optionsContainer.innerHTML = "";

            rData.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    modal.classList.add("hidden");
                    if (idx === rData.correct) {
                        lives++;
                        updateLivesDisplay();
                        alert("ВІТАЄМО! +1 Сердечко ❤️!");
                    } else {
                        alert("Невірно.");
                    }
                    resumeGame();
                };
                optionsContainer.appendChild(btn);
            });

            modal.classList.remove("hidden");
        }

        function triggerBoxQuest() {
            badgeType.innerText = "📦 СПЕЦ-МІСІЯ БОКС";
            badgeType.style.background = "#e91e63";
            questionTitle.innerText = "Відповой на 3 питання!";
            
            let step = 0;
            let timerLeft = 180;
            timerDisplay.classList.remove("hidden");

            const timerInterval = setInterval(() => {
                timerLeft--;
                timerSec.innerText = timerLeft;
                if (timerLeft <= 0) {
                    clearInterval(timerInterval);
                    modal.classList.add("hidden");
                    alert("Час вийшов!");
                    resumeGame();
                }
            }, 1000);

            function loadStep() {
                if (poolHard.length === 0) poolHard = shuffle([...questionsDB.hard]);
                const qData = poolHard.pop();

                questionText.innerText = `Питання ${step + 1}/3: ${qData.q}`;
                optionsContainer.innerHTML = "";

                qData.options.forEach((opt, idx) => {
                    const btn = document.createElement("button");
                    btn.className = "opt-btn";
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if (idx === qData.correct) {
                            step++;
                            if (step >= 3) {
                                clearInterval(timerInterval);
                                modal.classList.add("hidden");
                                boxesCollected++;
                                totalPoints += 3;
                                boxesEl.innerText = `📦 ${boxesCollected}/4`;
                                pointsEl.innerText = totalPoints;
                                alert("УРА! +3 Бали! 📦");
                                
                                if (boxesCollected >= 4) {
                                    document.getElementById("victory-modal").classList.remove("hidden");
                                    isGameOver = true;
                                } else {
                                    resumeGame();
                                }
                            } else {
                                loadStep();
                            }
                        } else {
                            clearInterval(timerInterval);
                            modal.classList.add("hidden");
                            alert("Помилка!");
                            resumeGame();
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
            }

            loadStep();
            modal.classList.remove("hidden");
        }

        function gameOver() {
            isGameOver = true;
            alert(`ГРА ЗАКІНЧЕНА! 🦖\nТвій рахунок: ${score}m`);
            location.reload();
        }
    </script>
</body>
</html>
